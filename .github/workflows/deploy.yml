name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  IMAGE: us-central1-docker.pkg.dev/automations-498612/atlas-sync/atlas-sync
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/453706028867/locations/global/workloadIdentityPools/cicd/providers/github-oidc
          service_account: ci-deployer@automations-498612.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t "$IMAGE:$SHA" .
          docker push "$IMAGE:$SHA"

      - name: Update Cloud Run Job
        run: gcloud run jobs update atlas-sync --image "$IMAGE:$SHA" --region us-central1
